name: chika
description: "Chika - Private, end-to-end encrypted messaging with biometric authentication and zero-knowledge ephemeral relay."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cryptography and E2EE
  cryptography: ^2.9.0
  libsignal_protocol_dart: ^0.8.2
  flutter_secure_storage: ^11.2.0
  # Biometric Security
  local_auth: ^3.0.2
  # Networking & Realtime
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  # QR Code Contact Pairing
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  # Media handling
  image_picker: ^1.2.4
  record: ^7.2.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  # State Management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
