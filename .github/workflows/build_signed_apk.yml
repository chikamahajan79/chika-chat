name: Build and Sign Chika Android APK & Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Release Keystore
        run: |
          mkdir -p app/android/app
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/android/app/upload-keystore.jks \
            -storepass "ChikaSecurePassword2026" \
            -keypass "ChikaSecurePassword2026" \
            -dname "CN=Chetan, O=Chika, C=US, EMAIL=chetan@chetan.co"

      - name: Create key.properties
        run: |
          cat <<EOF > app/android/key.properties
          storePassword=ChikaSecurePassword2026
          keyPassword=ChikaSecurePassword2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Signed Release APK
        run: |
          cd app
          flutter build apk --release

      - name: Build Signed Release AAB (for Play Store)
        run: |
          cd app
          flutter build appbundle --release

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chika-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chika-playstore-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
